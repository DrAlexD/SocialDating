version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/client"
    schedule:
      interval: "monthly"
    groups:
      client-updates:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/server"
    schedule:
      interval: "monthly"
    groups:
      server-updates:
        patterns:
          - "*"
