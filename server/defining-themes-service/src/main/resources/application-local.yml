management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,shutdown

security:
  whitelist:
    - /actuator/health
    - /actuator/shutdown
    - /defining-themes/v3/api-docs

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env
  datasource:
    url: jdbc:postgresql://localhost:5433/social_dating_db
  kafka:
    bootstrap-servers: localhost:9093