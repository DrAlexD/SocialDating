management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

spring:
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:postgresql://postgres:5432/social_dating_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always

services:
  gateway:
    host: gateway-service
    port: 8080
  users:
    host: users-service
    port: 8010
  categories:
    host: categories-service
    port: 8020
  defining-themes:
    host: defining-themes-service
    port: 8030
  statements:
    host: statements-service
    port: 8040
