socialdating.validation.trimmedSize=must have size between {min} and {max} excluding leading and trailing spaces
socialdating.validation.username=can contain only letters, numbers and underscores
socialdating.validation.telegram=must start with @ and contain only latin letters, numbers and underscores, starting with a letter and not ending with an underscore
socialdating.validation.range=must not be less than {minName}
socialdating.validation.ageRange=must correspond to the age between {min} and {max}
